slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    # Match the frozen TurtleBot3 simulated/physical LiDAR profile used by
    # unknown-completion. A real sensor profile may override this one value.
    max_laser_range: 20.0
    minimum_time_interval: 0.20
    transform_timeout: 0.20
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 1.5
    # The development corridor contains repeated, nearly identical alcoves.
    # With the upstream 3 m / 8 m search windows (and the former local 4 m
    # candidate radius), slam_toolbox accepted false translational loop
    # closures of 2.13--2.77 m while changing yaw by less than 0.012 rad.
    # Re-visits in this suite pass within the link-matching radius, so keep
    # legitimate local closures while excluding those aliased corridor shifts.
    loop_search_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 20
    loop_match_maximum_variance_coarse: 1.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
